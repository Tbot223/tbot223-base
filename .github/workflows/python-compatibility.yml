name: Python Compatibility CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with test, type, and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,type,lint]"

      - name: Set up Markdown linting
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Markdown linting tool
        run: npm ci

      - name: Run tests
        run: pytest -q

      - name: Check package typing
        run: python -m mypy

      - name: Lint and format Python
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Check rejected Result API typing
        run: |
          if python -m mypy tests/typecheck/invalid_result_api.py; then
            echo "The intentionally invalid Result API fixture unexpectedly passed."
            exit 1
          fi

      - name: Check public docstring contract
        run: python scripts/check-docstring-contract.py

      - name: Lint Markdown
        run: npx markdownlint-cli2 "**/*.md" "#node_modules"
